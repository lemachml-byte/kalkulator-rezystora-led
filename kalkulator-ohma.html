<!doctype html>
<html lang="pl">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Prawo Ohma — Rezystor — Moc — LeMaCh</title>

<style>

:root{
    --navy:#27376d;
    --navy2:#1f2d5a;
    --bg:#f3f4f6;
    --border:#d8e0eb;
    --text:#172033;
    --muted:#68748a;
    --green:#16803c;
    --red:#b42318;
    --orange:#b77900
}

*{
    box-sizing:border-box
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif
}

main{
    max-width:980px;
    margin:auto;
    padding:24px 14px 55px
}

.card{
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,.08)
}

.back{
    display:inline-block;
    margin-bottom:20px;
    padding:9px 14px;
    border:1px solid var(--border);
    border-radius:9px;
    color:var(--navy);
    text-decoration:none;
    font-weight:700
}

.logo{
    text-align:center;
    margin-bottom:16px
}

.logo img{
    width:190px;
    max-width:70%
}

h1{
    margin:0;
    text-align:center;
    color:var(--navy);
    font-size:30px
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin:8px 0 26px
}

.section{
    margin-top:20px;
    padding:20px;
    border:1px solid var(--border);
    border-radius:15px;
    background:#fbfcfe
}

.section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 16px;
    color:var(--navy);
    font-size:17px
}

.num{
    display:flex;
    align-items:center;
    justify-content:center;
    width:27px;
    height:27px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    font-size:13px;
    font-weight:800
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px
}

.full{
    grid-column:1/-1
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:750
}

input,
select{
    width:100%;
    min-height:48px;
    padding:11px 13px;
    border:1px solid #cbd3e1;
    border-radius:10px;
    background:#fff;
    color:var(--text);
    font-size:16px
}

input:focus,
select:focus{
    outline:3px solid rgba(39,55,109,.14);
    border-color:var(--navy)
}

.converter{
    margin-top:7px;
    padding:7px 10px;
    border-radius:8px;
    background:#f1f4f9;
    color:#536078;
    font-size:13px;
    line-height:1.45
}

.converter strong{
    color:var(--navy)
}

button{
    width:100%;
    min-height:54px;
    margin-top:20px;
    padding:14px 18px;
    border:0;
    border-radius:11px;
    background:var(--navy);
    color:#fff;
    font-size:17px;
    font-weight:800;
    cursor:pointer
}

button:hover{
    background:var(--navy2)
}

.results{
    margin-top:22px;
    display:grid;
    gap:12px
}

.box{
    padding:17px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#fff
}

.good{
    border-left:5px solid var(--green);
    background:#f0fdf4
}

.bad{
    border-left:5px solid var(--red);
    background:#fff4f4
}

.warn{
    border-left:5px solid var(--orange);
    background:#fff8e8
}

.title{
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase
}

.value{
    margin-top:4px;
    color:var(--navy);
    font-size:28px;
    font-weight:850
}

.detail{
    margin-top:7px;
    color:#536078;
    font-size:14px;
    line-height:1.5
}

.formula{
    margin-top:20px;
    padding:18px;
    border-radius:13px;
    background:#f5f7fb;
    border:1px solid var(--border);
    color:#34415d;
    font-family:
        Consolas,
        Monaco,
        monospace;
    line-height:1.8
}

.legend{
    margin-top:20px;
    padding:18px;
    border:1px solid var(--border);
    border-radius:13px;
    background:#f8fafc
}

.legend h3{
    margin:0 0 10px;
    color:var(--navy);
    font-size:16px
}

.legend table{
    border-collapse:collapse;
    width:100%
}

.legend th,
.legend td{
    text-align:left;
    padding:6px 8px;
    border-bottom:1px solid var(--border);
    font-size:14px
}

.legend th{
    color:var(--muted)
}

.footer{
    margin-top:26px;
    padding-top:16px;
    border-top:1px solid var(--border);
    text-align:center;
    color:#8791a3;
    font-size:12px
}

@media(max-width:680px){

    main{
        padding:12px 9px 35px
    }

    .card{
        padding:19px 14px
    }

    .grid{
        grid-template-columns:1fr
    }

    .full{
        grid-column:auto
    }

    h1{
        font-size:25px
    }

    .logo img{
        width:165px
    }

}

</style>

</head>

<body>

<main>

<section class="card">

<a class="back"
   href="index.html">
    ← Wszystkie kalkulatory
</a>


<div class="logo">

<img
    src="logo.svg"
    alt="LeMaCh">

</div>


<h1>
    Prawo Ohma — Rezystor — Moc
</h1>

<p class="subtitle">
    Kalkulator podstawowych zależności elektrycznych
</p>


<!-- =========================
     1. WYBÓR OBLICZENIA
========================= -->

<section class="section">

<h2 class="section-title">

<span class="num">
1
</span>

Co chcesz obliczyć?

</h2>


<select
    id="mode"
    onchange="setMode()">

<option value="U">
    Napięcie U [V]
</option>

<option value="I">
    Prąd I [A]
</option>

<option value="R">
    Rezystancję R [Ω]
</option>

<option value="P">
    Moc P [W]
</option>

</select>

</section>


<!-- =========================
     2. DANE
========================= -->

<section class="section">

<h2 class="section-title">

<span class="num">
2
</span>

Dane wejściowe

</h2>


<div class="grid">


<div>

<label id="l1">
</label>


<input
    id="a"
    type="text"
    inputmode="decimal"
    oninput="update(1)"
>


<div
    id="c1"
    class="converter">
</div>

</div>


<div>

<label id="l2">
</label>


<input
    id="b"
    type="text"
    inputmode="decimal"
    oninput="update(2)"
>


<div
    id="c2"
    class="converter">
</div>

</div>


</div>

</section>


<button
    onclick="calc()">

OBLICZ

</button>


<div
    id="res"
    class="results">
</div>


<!-- =========================
     WZORY
========================= -->

<div class="formula">

<strong>
Wzory
</strong>

<br>

U = I × R

<br>

I = U / R

<br>

R = U / I

<br>

P = U × I

<br>

P = I² × R

<br>

P = U² / R

</div>


<div class="footer">

LeMaCh • Narzędzia obliczeniowe • Elektronika

</div>

</section>

</main>


<script>


/* =====================================================
   KONWERSJA LICZB
===================================================== */

function num(v){

    if(
        v === null ||
        v === undefined ||
        String(v).trim() === ""
    ){

        return NaN;

    }


    return parseFloat(

        String(v)
            .replace(",",".")
            .replace(/\s/g,"")

    );

}


/* =====================================================
   FORMATOWANIE
===================================================== */

function fmt(
    x,
    n = 4
){

    return Number.isFinite(x)
        ? Number(x.toFixed(n)).toString()
        : "—";

}


/* =====================================================
   AUTOMATYCZNY DOBÓR JEDNOSTKI
===================================================== */

function bestUnit(
    v,
    type
){

    if(!Number.isFinite(v)){
        return "";
    }


    const av =
        Math.abs(v);


    /* =========================
       PRĄD
    ========================= */

    if(type === "current"){

        if(av < 1e-3){

            return `
                ${fmt(v * 1e6,3)}
                µA
            `;

        }

        if(av < 1){

            return `
                ${fmt(v * 1e3,3)}
                mA
            `;

        }

        if(av < 1e3){

            return `
                ${fmt(v,4)}
                A
            `;

        }

        return `
            ${fmt(v / 1e3,3)}
            kA
        `;

    }


    /* =========================
       NAPIĘCIE
    ========================= */

    if(type === "voltage"){

        if(av < 1){

            return `
                ${fmt(v * 1e3,3)}
                mV
            `;

        }

        if(av < 1e3){

            return `
                ${fmt(v,4)}
                V
            `;

        }

        return `
            ${fmt(v / 1e3,3)}
            kV
        `;

    }


    /* =========================
       REZYSTANCJA
    ========================= */

    if(type === "resistance"){

        if(av < 1){

            return `
                ${fmt(v * 1e3,3)}
                mΩ
            `;

        }

        if(av < 1e3){

            return `
                ${fmt(v,4)}
                Ω
            `;

        }

        if(av < 1e6){

            return `
                ${fmt(v / 1e3,4)}
                kΩ
            `;

        }

        return `
            ${fmt(v / 1e6,4)}
            MΩ
        `;

    }


    /* =========================
       MOC
    ========================= */

    if(type === "power"){

        if(av < 1e-3){

            return `
                ${fmt(v * 1e6,3)}
                µW
            `;

        }

        if(av < 1){

            return `
                ${fmt(v * 1e3,3)}
                mW
            `;

        }

        if(av < 1e3){

            return `
                ${fmt(v,4)}
                W
            `;

        }

        return `
            ${fmt(v / 1e3,3)}
            kW
        `;

    }

}


/* =====================================================
   PRZELICZNIK POD POLEM
===================================================== */

function conv(
    v,
    type,
    base
){

    if(!Number.isFinite(v)){

        return "Wpisz wartość.";

    }


    return `

        <strong>
            ${fmt(v,6)} ${base}
        </strong>

        =

        ${bestUnit(v,type)}

    `;

}


/* =====================================================
   STAŁA LEGENDA REZYSTANCJI
===================================================== */

function legend(){

    return `

    <div class="legend">

        <h3>
            Stała legenda jednostek rezystancji
        </h3>


        <table>

            <tr>

                <th>
                    Symbol
                </th>

                <th>
                    Nazwa
                </th>

                <th>
                    Wartość
                </th>

            </tr>


            <tr>

                <td>
                    <strong>mΩ</strong>
                </td>

                <td>
                    miliom
                </td>

                <td>
                    0,001 Ω
                </td>

            </tr>


            <tr>

                <td>
                    <strong>Ω</strong>
                </td>

                <td>
                    om
                </td>

                <td>
                    1 Ω
                </td>

            </tr>


            <tr>

                <td>
                    <strong>kΩ</strong>
                </td>

                <td>
                    kiloohm
                </td>

                <td>
                    1 000 Ω
                </td>

            </tr>


            <tr>

                <td>
                    <strong>MΩ</strong>
                </td>

                <td>
                    megaohm
                </td>

                <td>
                    1 000 000 Ω
                </td>

            </tr>


        </table>

    </div>

    `;

}


/* =====================================================
   KARTA WYNIKU
===================================================== */

function box(
    t,
    v,
    d
){

    return `

    <div class="box good">

        <div class="title">
            ${t}
        </div>

        <div class="value">
            ${v}
        </div>

        <div class="detail">
            ${d}
        </div>

    </div>

    `;

}


/* =====================================================
   BŁĄD
===================================================== */

function error(t){

    return `

    <div class="box bad">

        <div class="title">
            BŁĄD DANYCH
        </div>

        <div class="value">
            Nie można obliczyć
        </div>

        <div class="detail">
            ${t}
        </div>

    </div>

    `

    +

    legend();

}


/* =====================================================
   USTAWIENIE PÓL
===================================================== */

function setField(
    n,
    label,
    kind,
    placeholder
){

    const el =
        document.getElementById(
            n === 1
                ? "a"
                : "b"
        );


    document.getElementById(
        "l" + n
    ).innerHTML =
        label;


    el.placeholder =
        placeholder;


    el.dataset.kind =
        kind;


    document.getElementById(
        "c" + n
    ).innerHTML =
        "Wpisz wartość.";

}


/* =====================================================
   ZMIANA TRYBU
===================================================== */

function setMode(){

    const m =
        mode.value;


    res.innerHTML =
        "";


    /* NAPIĘCIE */

    if(m === "U"){

        setField(
            1,
            "Prąd I [A]",
            "current",
            "np. 0,02"
        );


        setField(
            2,
            "Rezystancja R [Ω]",
            "resistance",
            "np. 600"
        );

    }


    /* PRĄD */

    if(m === "I"){

        setField(
            1,
            "Napięcie U [V]",
            "voltage",
            "np. 12"
        );


        setField(
            2,
            "Rezystancja R [Ω]",
            "resistance",
            "np. 600"
        );

    }


    /* REZYSTANCJA */

    if(m === "R"){

        setField(
            1,
            "Napięcie U [V]",
            "voltage",
            "np. 12"
        );


        setField(
            2,
            "Prąd I [A]",
            "current",
            "np. 0,02"
        );

    }


    /* MOC */

    if(m === "P"){

        setField(
            1,
            "Napięcie U [V]",
            "voltage",
            "np. 12"
        );


        setField(
            2,
            "Prąd I [A]",
            "current",
            "np. 0,02"
        );

    }

}


/* =====================================================
   AKTUALIZACJA PRZELICZNIKA
===================================================== */

function update(n){

    const el =
        document.getElementById(
            n === 1
                ? "a"
                : "b"
        );


    const base =
        el.dataset.kind === "current"
            ? "A"
            : el.dataset.kind === "voltage"
                ? "V"
                : "Ω";


    document.getElementById(
        "c" + n
    ).innerHTML =
        conv(
            num(el.value),
            el.dataset.kind,
            base
        );

}


/* =====================================================
   OBLICZENIE
===================================================== */

function calc(){

    const m =
        mode.value;


    const A =
        num(a.value);


    const B =
        num(b.value);


    /* WALIDACJA */

    if(
        !Number.isFinite(A) ||
        !Number.isFinite(B) ||
        A <= 0 ||
        B <= 0
    ){

        res.innerHTML =
            error(
                "Wszystkie wartości muszą być większe od zera."
            );

        return;

    }


    let U;
    let I;
    let R;
    let P;


    /* =========================
       OBLICZ U
    ========================= */

    if(m === "U"){

        I = A;

        R = B;

        U =
            I * R;

    }


    /* =========================
       OBLICZ I
    ========================= */

    if(m === "I"){

        U = A;

        R = B;

        I =
            U / R;

    }


    /* =========================
       OBLICZ R
    ========================= */

    if(m === "R"){

        U = A;

        I = B;

        R =
            U / I;

    }


    /* =========================
       OBLICZ P
    ========================= */

    if(m === "P"){

        U = A;

        I = B;

        P =
            U * I;

        R =
            U / I;

    }


    /* MOC */

    P =
        U * I;


    let h =
        "";


    /* =========================
       WYNIK GŁÓWNY
    ========================= */

    if(m === "U"){

        h +=

        box(
            "NAPIĘCIE U",
            `${fmt(U,2)} V`,
            `
            U = I × R
            <br>
            ${bestUnit(
                U,
                "voltage"
            )}
            `
        );

    }


    if(m === "I"){

        h +=

        box(
            "PRĄD I",
            `${fmt(I,6)} A`,
            `
            I = U / R
            <br>
            ${bestUnit(
                I,
                "current"
            )}
            `
        );

    }


    if(m === "R"){

        h +=

        box(
            "REZYSTANCJA R",
            `${fmt(R,2)} Ω`,
            `
            R = U / I
            <br>
            ${bestUnit(
                R,
                "resistance"
            )}
            `
        );

    }


    if(m === "P"){

        h +=

        box(
            "MOC P",
            `${fmt(P,4)} W`,
            `
            P = U × I
            <br>
            ${bestUnit(
                P,
                "power"
            )}
            `
        );

    }


    /* =========================
       PEŁNY ZESTAW WYNIKÓW
    ========================= */

    h +=

    box(
        "MOC P",
        `${fmt(P,4)} W`,
        `
        P = U × I
        <br>
        ${bestUnit(
            P,
            "power"
        )}
        `
    );


    h +=

    box(
        "NAPIĘCIE U",
        `${fmt(U,2)} V`,
        `
        U = I × R
        <br>
        ${bestUnit(
            U,
            "voltage"
        )}
        `
    );


    h +=

    box(
        "PRĄD I",
        `${fmt(I,6)} A`,
        `
        I = U / R
        <br>
        ${bestUnit(
            I,
            "current"
        )}
        `
    );


    h +=

    box(
        "REZYSTANCJA R",
        `${fmt(R,2)} Ω`,
        `
        R = U / I
        <br>
        ${bestUnit(
            R,
            "resistance"
        )}
        `
    );


    res.innerHTML =
        h +
        legend();

}


/* =====================================================
   START
===================================================== */

setMode();


</script>

</body>

</html>
