<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prawo Ohma — Rezystor — Moc</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

main{
  max-width:900px;
  margin:auto;
  padding:35px 20px 60px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:32px;
  box-shadow:0 8px 30px #0002;
}

h1{
  margin:0 0 8px;
  font-size:36px;
}

.subtitle{
  color:#64748b;
  font-size:18px;
  margin-bottom:28px;
}

.choose{
  background:#f8fafc;
  border:1px solid #dbe2ea;
  border-radius:18px;
  padding:24px;
  margin-bottom:24px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

select,
input{
  width:100%;
  padding:15px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:18px;
  background:white;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  background:#f8fafc;
  border:1px solid #dbe2ea;
  border-radius:18px;
  padding:24px;
}

.field small{
  display:block;
  color:#64748b;
  margin-top:7px;
  line-height:1.4;
}

button{
  width:100%;
  margin-top:24px;
  padding:17px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#1f2937;
}

.result{
  margin-top:24px;
  border:1px solid #d1d5db;
  border-left:6px solid #16803c;
  border-radius:15px;
  padding:20px;
  background:#fff;
}

.result h2{
  margin:0 0 8px;
  font-size:16px;
  color:#64748b;
  text-transform:uppercase;
}

.value{
  font-size:30px;
  font-weight:850;
  margin-bottom:8px;
}

.formula{
  color:#475569;
  font-size:17px;
}

.error{
  border-left-color:#b91c1c;
}

.formulas{
  margin-top:24px;
  padding:22px;
  border-radius:15px;
  background:#f1f3f6;
}

.formulas h3{
  margin-top:0;
}

.formulas div{
  margin:10px 0;
  font-family:monospace;
  font-size:17px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:22px;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<main>

<div class="card">

<h1>Prawo Ohma — Rezystor — Moc</h1>

<div class="subtitle">
Uniwersalny kalkulator podstawowych zależności elektrycznych.
</div>

<div class="choose">

<label for="calculate">Co chcesz obliczyć?</label>

<select id="calculate" onchange="showFields()">
<option value="U">Napięcie U [V]</option>
<option value="I">Prąd I [A]</option>
<option value="R">Rezystancję R [Ω]</option>
<option value="P">Moc P [W]</option>
</select>

</div>

<div id="fields" class="grid"></div>

<button onclick="calculate()">OBLICZ</button>

<div id="results"></div>

<div class="formulas">

<h3>Podstawowe wzory:</h3>

<div>U = I × R</div>
<div>I = U / R</div>
<div>R = U / I</div>
<div>P = U × I</div>
<div>P = I² × R</div>
<div>P = U² / R</div>

</div>

</div>

</main>

<script>

function field(id,label,placeholder,help){

return `
<div class="field">

<label for="${id}">${label}</label>

<input
id="${id}"
type="number"
step="any"
placeholder="${placeholder}"
>

<small>${help}</small>

</div>
`;

}


function showFields(){

const type=document.getElementById("calculate").value;

let html="";

if(type==="U"){

html+=field(
"I",
"Prąd I [A]",
"np. 0,02",
"Dla 20 mA wpisz 0,02 A."
);

html+=field(
"R",
"Rezystancja R [Ω]",
"np. 600",
"Rezystancja odbiornika."
);

}

if(type==="I"){

html+=field(
"U",
"Napięcie U [V]",
"np. 12",
"Napięcie elektryczne."
);

html+=field(
"R",
"Rezystancja R [Ω]",
"np. 600",
"Rezystancja odbiornika."
);

}

if(type==="R"){

html+=field(
"U",
"Napięcie U [V]",
"np. 5",
"Napięcie elektryczne."
);

html+=field(
"I",
"Prąd I [A]",
"np. 0,02",
"Dla 20 mA wpisz 0,02 A."
);

}

if(type==="P"){

html+=field(
"U",
"Napięcie U [V]",
"np. 12",
"Napięcie elektryczne."
);

html+=field(
"I",
"Prąd I [A]",
"np. 0,5",
"Dla 20 mA wpisz 0,02 A."
);

html+=field(
"R",
"Rezystancja R [Ω]",
"np. 600",
"Rezystancja odbiornika."
);

}

document.getElementById("fields").innerHTML=html;

}


function number(id){

const value=document.getElementById(id);

if(!value){
return NaN;
}

return parseFloat(value.value);

}


function format(value){

if(!Number.isFinite(value)){
return "—";
}

if(Math.abs(value)>=1000){
return value.toLocaleString("pl-PL",{
maximumFractionDigits:3
});
}

return value.toLocaleString("pl-PL",{
maximumFractionDigits:6
});

}


function result(title,value,formula){

return `
<div class="result">

<h2>${title}</h2>

<div class="value">${value}</div>

<div class="formula">${formula}</div>

</div>
`;

}


function error(message){

document.getElementById("results").innerHTML=`

<div class="result error">

<h2>Błąd danych</h2>

<div class="value">Nie można obliczyć</div>

<div class="formula">${message}</div>

</div>

`;

}


function calculate(){

const type=document.getElementById("calculate").value;

const U=number("U");
const I=number("I");
const R=number("R");

let html="";

if(type==="U"){

if(!(I>0) || !(R>0)){

error("Podaj dodatni prąd I oraz rezystancję R.");

return;

}

const voltage=I*R;
const power=I*I*R;

html+=result(
"NAPIĘCIE U",
format(voltage)+" V",
`U = I × R = ${format(I)} A × ${format(R)} Ω`
);

html+=result(
"MOC P",
format(power)+" W",
`P = I² × R = ${format(I)}² × ${format(R)}`
);

}

if(type==="I"){

if(!(U>0) || !(R>0)){

error("Podaj dodatnie napięcie U oraz rezystancję R.");

return;

}

const current=U/R;
const power=U*current;

html+=result(
"PRĄD I",
format(current)+" A",
`I = U / R = ${format(U)} V / ${format(R)} Ω`
);

html+=result(
"PRĄD I",
format(current*1000)+" mA",
"Ta sama wartość wyrażona w miliamperach."
);

html+=result(
"MOC P",
format(power)+" W",
`P = U × I = ${format(U)} V × ${format(current)} A`
);

}

if(type==="R"){

if(!(U>0) || !(I>0)){

error("Podaj dodatnie napięcie U oraz prąd I.");

return;

}

const resistance=U/I;
const power=U*I;

html+=result(
"REZYSTANCJA R",
format(resistance)+" Ω",
`R = U / I = ${format(U)} V / ${format(I)} A`
);

html+=result(
"MOC P",
format(power)+" W",
`P = U × I = ${format(U)} V × ${format(I)} A`
);

}

if(type==="P"){

if(!(U>0) || !(I>0)){

error("Podaj dodatnie napięcie U oraz prąd I.");

return;

}

const power=U*I;
const resistance=U/I;

html+=result(
"MOC P",
format(power)+" W",
`P = U × I = ${format(U)} V × ${format(I)} A`
);

html+=result(
"REZYSTANCJA R",
format(resistance)+" Ω",
`R = U / I = ${format(U)} V / ${format(I)} A`
);

}

document.getElementById("results").innerHTML=html;

}

showFields();

</script>

</body>
</html>
